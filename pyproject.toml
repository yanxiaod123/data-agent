[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ladrag"
version = "0.1.0"
description = "Reproduction-oriented implementation of Layout-aware Dynamic RAG"
requires-python = ">=3.10"
dependencies = ["networkx>=3.2"]

[project.optional-dependencies]
pdf = ["PyMuPDF>=1.24"]
dev = ["pytest>=8.0"]

[project.scripts]
ladrag = "ladrag.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ladrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
